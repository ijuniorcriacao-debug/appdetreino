            const plotW = W - padL - padR, plotH = H - padT - padB;
            const xFor = (i) => series.length === 1 ? padL + plotW / 2 : padL + (plotW * i) / (series.length - 1);
            const yFor = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;
            const points = series.map((p, i) => ({ ...p, x: xFor(i), y: yFor(p.value) }));
            const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            const selIdx = Math.min(selected, points.length - 1);
            const sel = points[selIdx];
            const gridYs = [min + pad, (min + max) / 2, max - pad];

            return (
                <div className="mt-1">
                    <div className="flex items-baseline justify-between mb-1 px-0.5">
                        <span className="text-[11px] text-neutral-500">{sel ? fmtBR(sel.date) : ''}</span>
                        <span className="text-sm font-bold" style={{ color }}>{sel && sel.value != null ? `${sel.value}${unit}` : '--'}</span>
                    </div>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height }}>
                        {gridYs.map((gy, i) => {
                            const y = yFor(gy);
                            return <line key={i} x1={padL} x2={W - padR} y1={y} y2={y} stroke={COLORS.grid} strokeWidth="1" />;
                        })}
                        {target && target.min != null && target.max != null && (
                            <rect x={padL} y={yFor(target.max)} width={plotW} height={Math.max(0, yFor(target.min) - yFor(target.max))} fill={COLORS.good} opacity="0.12" />
                        )}
                        {type === 'bar' ? points.map((p, i) => {
                            const barW = Math.max(5, (plotW / points.length) * 0.55);
                            const baseY = padT + plotH;
                            return <rect key={i} x={p.x - barW / 2} y={p.y} width={barW} height={Math.max(0, baseY - p.y)} fill={color} opacity={i === selIdx ? 1 : 0.6} rx="2" onClick={() => setSelected(i)} />;
                        }) : (
                            <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                        )}
                        {type === 'line' && points.map((p, i) => (
                            <circle key={i} cx={p.x} cy={p.y} r={i === selIdx ? 4.5 : 3} fill={i === selIdx ? '#fff' : color} stroke={color} strokeWidth={i === selIdx ? 2 : 0} onClick={() => setSelected(i)} />
                        ))}
                        <text x={padL} y={H - 4} fontSize="9" fill={COLORS.muted}>{fmtBR(series[0].date)}</text>
                        <text x={W - padR} y={H - 4} fontSize="9" fill={COLORS.muted} textAnchor="end">{fmtBR(series[series.length - 1].date)}</text>
                    </svg>
                </div>
            );
        };

        const StatTile = ({ label, value, sub, color }) => (
            <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4">
                <div className="text-[10px] uppercase tracking-wide text-neutral-500 font-bold mb-1.5">{label}</div>
                <div className="font-display text-2xl font-extrabold" style={color ? { color } : undefined}>{value}</div>
                {sub && <div className="text-[10px] text-neutral-500 mt-1">{sub}</div>}
            </div>
        );

        const CompareRow = ({ label, before, after, unit = '', goodDir = null, decimals = 1 }) => {
            if (before == null || after == null) return null;
            const delta = after - before;
            const improved = goodDir === 'down' ? delta < 0 : goodDir === 'up' ? delta > 0 : null;
            const deltaColor = Math.abs(delta) < 0.0001 ? COLORS.muted : (improved === null ? COLORS.muted : (improved ? COLORS.good : COLORS.critical));
            const arrow = delta > 0.0001 ? '▲' : delta < -0.0001 ? '▼' : '—';
            return (
                <div className="flex items-center justify-between py-2 border-b border-neutral-800 last:border-0 gap-2">
                    <span className="text-xs text-neutral-400 shrink-0">{label}</span>
                    <div className="flex items-center gap-1.5 text-xs">
                        <span className="text-neutral-500">{before.toFixed(decimals)}{unit}</span>
                        <Icon name="ArrowRight" size={11} className="text-neutral-700" />
                        <span className="font-bold text-neutral-200">{after.toFixed(decimals)}{unit}</span>
                        <span className="text-xs font-bold ml-1 shrink-0" style={{ color: deltaColor }}>{arrow} {Math.abs(delta).toFixed(decimals)}</span>
                    </div>
                </div>
            );
        };

        const AlertBanner = ({ level = 'info', text }) => {
            const styles = {
                critical: { bg: 'bg-red-950/30', border: 'border-red-900/40', color: COLORS.critical, icon: 'AlertTriangle' },
                warning: { bg: 'bg-yellow-950/20', border: 'border-yellow-900/30', color: COLORS.warning, icon: 'AlertTriangle' },
                info: { bg: 'bg-blue-950/20', border: 'border-blue-900/30', color: COLORS.blue, icon: 'Info' },
                good: { bg: 'bg-green-950/20', border: 'border-green-900/30', color: COLORS.good, icon: 'CheckCircle' },
            };
            const s = styles[level] || styles.info;
            return (
                <div className={`flex items-start gap-2 p-3 rounded-lg border ${s.bg} ${s.border}`}>
                    <span style={{ color: s.color }} className="mt-0.5 shrink-0"><Icon name={s.icon} size={16} /></span>
                    <span className="text-xs text-neutral-300 leading-snug">{text}</span>
                </div>
            );
        };

        const NAV_TABS = [
            { id: 'dashboard', icon: 'Home', label: 'Início' },
            { id: 'treinos', icon: 'Dumbbell', label: 'Treino' },
            { id: 'nutricao', icon: 'Utensils', label: 'Nutrição' },
            { id: 'inbody', icon: 'Activity', label: 'InBody' },
            { id: 'progresso', icon: 'TrendingUp', label: 'Progresso' },
        ];
        const BottomNav = ({ view, onChange }) => (
            <div className="fixed bottom-0 inset-x-0 z-20 px-3 pb-3">
                <div className="max-w-md mx-auto bg-neutral-900/85 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl shadow-black/50 grid grid-cols-5 p-1.5">
                    {NAV_TABS.map(t => {
                        const active = view === t.id;
                        return (
                            <button key={t.id} onClick={() => onChange(t.id)} className={`relative flex flex-col items-center gap-0.5 py-2.5 rounded-2xl transition-colors ${active ? 'text-white' : 'text-neutral-500'}`}>
                                {active && <span className="absolute inset-0 accent-grad rounded-2xl -z-10"></span>}
                                <Icon name={t.icon} size={18} />
                                <span className="text-[9px] font-bold">{t.label}</span>
                            </button>
                        );
                    })}
                </div>
            </div>
        );

        const INBODY_FIELDS = [
            ['peso', 'Peso (kg)'], ['massa_muscular', 'Massa muscular (kg)'],
            ['massa_gordura', 'Massa gordura (kg)'], ['percentual_gordura', '% Gordura'],
            ['gordura_visceral', 'Gordura visceral'], ['cintura_quadril', 'Cintura/Quadril'],
            ['tmb', 'TMB (kcal)'], ['imc', 'IMC'],
            ['pontuacao', 'Pontuação InBody'], ['agua_corporal', 'Água corporal (L)'],
            ['proteina_corporal', 'Proteína corporal (kg)'],
        ];

        const App = () => {
            const [view, setView] = React.useState('login');
            const [userName, setUserName] = React.useState('');
            const [tempName, setTempName] = React.useState('');

            const [workouts, setWorkouts] = React.useState(TIME_HIBRIDO_WORKOUTS);
            const [currentWeek, setCurrentWeek] = React.useState(1);
            const [activeWorkoutId, setActiveWorkoutId] = React.useState(null);
            const [history, setHistory] = React.useState({});
            const [sessionData, setSessionData] = React.useState({});
            const [sessions, setSessions] = React.useState([]);
            const activeWorkout = workouts.find(w => w.id === activeWorkoutId);

            const [timerOpen, setTimerOpen] = React.useState(false);
            const [timeLeft, setTimeLeft] = React.useState(0);
            const [timerRunning, setTimerRunning] = React.useState(false);
            const timerInterval = React.useRef(null);

            const [importText, setImportText] = React.useState('');

            const [profile, setProfile] = React.useState(DEFAULT_PROFILE);
            const [goals, setGoals] = React.useState(DEFAULT_GOALS);
            const [supplements, setSupplements] = React.useState(DEFAULT_SUPPLEMENTS);
            const [inbody, setInbody] = React.useState(DEFAULT_INBODY);
            const [dailyLogs, setDailyLogs] = React.useState({});

            const [nutriForm, setNutriForm] = React.useState(makeEmptyNutriForm());
            const [inbodyForm, setInbodyForm] = React.useState(null);
            const [compareA, setCompareA] = React.useState(null);
            const [compareB, setCompareB] = React.useState(null);
            const [reportPeriod, setReportPeriod] = React.useState(30);
            const [selectedExercise, setSelectedExercise] = React.useState('');
            const [profileDraft, setProfileDraft] = React.useState(null);
            const [newSupplement, setNewSupplement] = React.useState({ nome: '', dose: '', horario: '' });

            React.useEffect(() => {
                const sw = localStorage.getItem('gymWorkoutsV3'); if (sw) setWorkouts(JSON.parse(sw));
                const sh = localStorage.getItem('gymHistoryV3'); if (sh) setHistory(JSON.parse(sh));
                const ss = localStorage.getItem('gymSessionsV1'); if (ss) setSessions(JSON.parse(ss));
                const sp = localStorage.getItem('gymProfileV1'); if (sp) setProfile(JSON.parse(sp));
                const sg = localStorage.getItem('gymGoalsV1'); if (sg) setGoals(JSON.parse(sg));
                const ssup = localStorage.getItem('gymSupplementsV1'); if (ssup) setSupplements(JSON.parse(ssup));
                const sib = localStorage.getItem('gymInBodyV1'); if (sib) setInbody(JSON.parse(sib));
                const sdl = localStorage.getItem('gymDailyLogsV1'); if (sdl) setDailyLogs(JSON.parse(sdl));
                const su = localStorage.getItem('gymUserName'); if (su) { setUserName(su); setView('dashboard'); }
                const scw = localStorage.getItem('gymCurrentWeekV1'); if (scw) setCurrentWeek(Number(scw));
                if (window.lucide) window.lucide.createIcons();
            }, []);

            React.useEffect(() => {
                if (inbody.length >= 2) { setCompareA(inbody[0].id); setCompareB(inbody[inbody.length - 1].id); }
                else if (inbody.length === 1) { setCompareA(inbody[0].id); setCompareB(inbody[0].id); }
            }, [inbody.length]);

            const saveWorkouts = (w) => { setWorkouts(w); localStorage.setItem('gymWorkoutsV3', JSON.stringify(w)); };
            const saveHistory = (h) => { setHistory(h); localStorage.setItem('gymHistoryV3', JSON.stringify(h)); };
            const saveSessions = (s) => { setSessions(s); localStorage.setItem('gymSessionsV1', JSON.stringify(s)); };
            const saveProfile = (p) => { setProfile(p); localStorage.setItem('gymProfileV1', JSON.stringify(p)); };
            const saveGoals = (g) => { setGoals(g); localStorage.setItem('gymGoalsV1', JSON.stringify(g)); };
            const saveSupplements = (s) => { setSupplements(s); localStorage.setItem('gymSupplementsV1', JSON.stringify(s)); };
            const saveInbody = (a) => { setInbody(a); localStorage.setItem('gymInBodyV1', JSON.stringify(a)); };
            const saveDailyLogs = (d) => { setDailyLogs(d); localStorage.setItem('gymDailyLogsV1', JSON.stringify(d)); };
            const changeWeek = (n) => { const w = Math.min(TOTAL_SEMANAS, Math.max(1, n)); setCurrentWeek(w); localStorage.setItem('gymCurrentWeekV1', String(w)); };

            const handleLogin = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    localStorage.setItem('gymUserName', tempName.trim());
                    setUserName(tempName.trim());
                    saveProfile({ ...profile, nome: tempName.trim() });
                    setView('dashboard');
                }
            };

            const handleLogout = () => {
                if (confirm("Deseja sair?")) {
                    localStorage.removeItem('gymUserName');
                    setUserName(''); setTempName(''); setView('login');
                }
            };

            const handleFullReset = () => {
                if (confirm("ATENÇÃO: Isso apagará TODOS os seus dados. Tem certeza?")) {
                    localStorage.clear(); window.location.reload();
                }
            };

            const processImport = () => {
                try {
                    if (!importText.trim()) return;
                    const lines = importText.split('\n').map(l => l.trim()).filter(l => l);
                    const newWorkouts = [];
                    let currentWorkout = null;
                    let exerciseCount = 0;
                    let nextIsBiset = false;

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        const upperLine = line.toUpperCase();

                        if (upperLine.startsWith('TREINO') || upperLine.startsWith('WORKOUT')) {
                            if (currentWorkout) newWorkouts.push(currentWorkout);
                            currentWorkout = { id: `imp_${Date.now()}_${newWorkouts.length}`, name: line, exercises: [] };
                            nextIsBiset = false; continue;
                        }

                        if (upperLine === 'BISET' || upperLine === '+') {
                            nextIsBiset = true;
                            if (upperLine === '+' && currentWorkout && currentWorkout.exercises.length > 0) {
                                const lastEx = currentWorkout.exercises[currentWorkout.exercises.length - 1];
                                if (!lastEx.note || !lastEx.note.includes('BISET')) {
                                    lastEx.note = lastEx.note ? `BISET • ${lastEx.note}` : 'BISET';
                                }
                            }
                            continue;
                        }

                        const setsMatch = line.match(/(\d+\s*[xX]\s*\d+)/);
                        if (setsMatch && currentWorkout) {
                            let namePart = line.substring(0, setsMatch.index).trim().replace(/^\d+[\.|-]\s*/, '').replace(/[-–]\s*$/, '');
                            let notePart = line.substring(setsMatch.index + setsMatch[0].length).trim().replace(/^\(/, '').replace(/\)$/, '');
                            let tags = [];
                            let isThisBiset = nextIsBiset;
                            const nextLine = (i + 1 < lines.length) ? lines[i + 1].trim() : '';
                            if (nextLine === '+' || nextLine.toUpperCase() === 'BISET') { isThisBiset = true; nextIsBiset = true; }
                            else { nextIsBiset = false; }

                            if (isThisBiset) tags.push('BISET');
                            if (upperLine.includes('DROP')) tags.push('DROP');
                            if (upperLine.includes('FALHA')) tags.push('FALHA');

                            let finalNote = [...tags, notePart].join(' • ');
                            currentWorkout.exercises.push({ id: `ex_${currentWorkout.id}_${exerciseCount++}`, name: namePart, sets: setsMatch[0], note: finalNote });
                        }
                    }
                    if (currentWorkout) newWorkouts.push(currentWorkout);
                    if (newWorkouts.length > 0) {
                        saveWorkouts(newWorkouts);
                        alert('Treinos importados!'); setView('treinos'); setImportText('');
                    } else { alert('Padrão não reconhecido.'); }
                } catch (e) { alert('Erro ao processar.'); }
            };

            const resetToDefault = () => { if (confirm("Restaurar o protocolo padrão (Time Híbrido — 12 semanas)?")) { setWorkouts(TIME_HIBRIDO_WORKOUTS); localStorage.removeItem('gymWorkoutsV3'); setView('treinos'); } };
            const startWorkout = (id) => { setActiveWorkoutId(id); setSessionData({}); setView('workout'); };
            const toggleExercise = (id) => { setSessionData(prev => ({ ...prev, [id]: { ...prev[id], done: !prev[id]?.done } })); };
            const updateWeight = (id, w) => { setSessionData(prev => ({ ...prev, [id]: { ...prev[id], weight: w } })); };
            const finishWorkout = () => {
                const newH = { ...history };
                const doneExercises = [];
                Object.keys(sessionData).forEach(id => {
                    if (sessionData[id].done && sessionData[id].weight) {
                        newH[id] = sessionData[id].weight;
                        const ex = activeWorkout?.exercises.find(e => e.id === id);
                        if (ex) doneExercises.push({ id, name: ex.name, weight: sessionData[id].weight });
                    }
                });
                saveHistory(newH);
                if (doneExercises.length > 0) {
                    const record = { id: uid('sess'), date: todayISO(), workoutId: activeWorkout.id, workoutName: activeWorkout.grupo || activeWorkout.name, letra: activeWorkout.letra, exercises: doneExercises };
                    saveSessions([...sessions, record]);
                }
                setView('treinos'); setActiveWorkoutId(null);
            };
            const startTimer = (s) => { clearInterval(timerInterval.current); setTimeLeft(s); setTimerOpen(true); setTimerRunning(true); timerInterval.current = setInterval(() => setTimeLeft(p => p <= 1 ? (clearInterval(timerInterval.current), setTimerRunning(false), 0) : p - 1), 1000); };
            const closeTimer = () => { setTimerOpen(false); clearInterval(timerInterval.current); };

            const loadNutriForm = (date) => {
                const existing = dailyLogs[date];
                setNutriForm(existing ? {
                    data: date,
                    peso_manha: existing.peso_manha ?? '', kcal: existing.kcal ?? '', proteina: existing.proteina ?? '',
                    carbo: existing.carbo ?? '', gordura: existing.gordura ?? '', agua_ml: existing.agua_ml ?? '',
                    humor: existing.humor ?? 3, energia: existing.energia ?? 3, sono_horas: existing.sono_horas ?? '', observacoes: existing.observacoes ?? '',
                } : makeEmptyNutriForm(date));
            };

            const upsertDailyLog = (date, patch) => {
                const existing = dailyLogs[date] || {};
                saveDailyLogs({ ...dailyLogs, [date]: { ...existing, ...patch } });
            };
            const saveNutriForm = () => {
                const f = nutriForm;
                upsertDailyLog(f.data, {
                    peso_manha: parseNum(f.peso_manha), kcal: parseNum(f.kcal), proteina: parseNum(f.proteina),
                    carbo: parseNum(f.carbo), gordura: parseNum(f.gordura), agua_ml: parseNum(f.agua_ml),
                    humor: f.humor, energia: f.energia, sono_horas: parseNum(f.sono_horas), observacoes: f.observacoes,
                });
                alert('Registro salvo!');
            };
            const toggleSupplementToday = (date, supId) => {
                const existing = dailyLogs[date] || {};
                const sup = { ...(existing.suplementos || {}) };
                sup[supId] = !sup[supId];
                upsertDailyLog(date, { suplementos: sup });
            };

            const startNewInbody = () => setInbodyForm({ id: uid('ib'), data: todayISO(), peso: '', massa_muscular: '', massa_gordura: '', percentual_gordura: '', gordura_visceral: '', cintura_quadril: '', tmb: '', imc: '', pontuacao: '', agua_corporal: '', proteina_corporal: '' });
            const saveInbodyForm = () => {
                const f = inbodyForm;
                const rec = { id: f.id, data: f.data };
                INBODY_FIELDS.forEach(([key]) => { rec[key] = parseNum(f[key]); });
                if (!rec.data || rec.peso == null) { alert('Preencha ao menos data e peso.'); return; }
                const next = [...inbody.filter(x => x.id !== rec.id), rec].sort((a, b) => a.data.localeCompare(b.data));
                saveInbody(next);
                setInbodyForm(null);
            };
            const deleteInbody = (id) => { if (confirm('Excluir esta avaliação?')) saveInbody(inbody.filter(x => x.id !== id)); };

            const startEditProfile = () => setProfileDraft({ ...profile, ...goals });
            const saveProfileDraft = () => {
                const d = profileDraft;
                saveProfile({ ...profile, nome: d.nome, apelido: d.apelido, idade: parseNum(d.idade), altura_cm: parseNum(d.altura_cm) });
                saveGoals({
                    ...goals,
                    peso_alvo_min: parseNum(d.peso_alvo_min), peso_alvo_max: parseNum(d.peso_alvo_max),
                    gordura_alvo_min: parseNum(d.gordura_alvo_min), gordura_alvo_max: parseNum(d.gordura_alvo_max),
                    meta_proteina_min: parseNum(d.meta_proteina_min), meta_proteina_max: parseNum(d.meta_proteina_max),
                });
                setProfileDraft(null);
            };
            const addSupplement = () => {
                if (!newSupplement.nome.trim()) return;
                saveSupplements([...supplements, { id: uid('sup'), status: 'OPCIONAL', ...newSupplement }]);
                setNewSupplement({ nome: '', dose: '', horario: '' });
            };
            const removeSupplement = (id) => saveSupplements(supplements.filter(s => s.id !== id));

            // --- DERIVADOS ---
            const today = todayISO();
            const todayLog = dailyLogs[today] || {};
            const lastInbody = inbody.length ? inbody[inbody.length - 1] : null;
            const latestPeso = todayLog.peso_manha ?? (lastInbody ? lastInbody.peso : null);
            const latestGordura = lastInbody ? lastInbody.percentual_gordura : null;
            const weekdayIdx = new Date().getDay();
            const weekWorkouts = React.useMemo(() => getWeekWorkouts(workouts, currentWeek), [workouts, currentWeek]);
            const weekdayWorkoutIds = React.useMemo(() => getWeekdayWorkoutIds(weekWorkouts), [weekWorkouts]);
            const todayWorkoutId = weekdayWorkoutIds[weekdayIdx];
            const todayWorkout = workouts.find(w => w.id === todayWorkoutId);
            const currentEtapa = weekWorkouts.find(w => w.local_manha && w.local_manha.length)?.local_manha[0] || '';

            const alerts = React.useMemo(() => {
                const list = [];
                const hour = new Date().getHours();
                const tLog = dailyLogs[today] || {};
                const proteinaMeta = goals.meta_proteina_min || 150;
                if (hour >= 18 && (tLog.proteina || 0) < proteinaMeta) {
                    list.push({ level: 'warning', text: `Proteína hoje está em ${tLog.proteina || 0}g — meta é ${proteinaMeta}g. Ainda dá tempo de completar no lanche/jantar.` });
                }
                if (tLog.kcal != null && tLog.kcal < 1500 && hour >= 20) {
                    list.push({ level: 'critical', text: `Calorias muito baixas hoje (${tLog.kcal} kcal). Risco de déficit severo — coma algo antes de dormir.` });
                } else if (hour >= 20 && tLog.kcal == null) {
                    list.push({ level: 'info', text: 'Você ainda não registrou sua nutrição de hoje.' });
                }
                const monthAgo = addDaysISO(today, -30);
                const pesoDates = Object.keys(dailyLogs).filter(d => d >= monthAgo && d <= today && dailyLogs[d].peso_manha != null).sort();
                if (pesoDates.length >= 2) {
                    const delta = dailyLogs[pesoDates[pesoDates.length - 1]].peso_manha - dailyLogs[pesoDates[0]].peso_manha;
                    if (delta > (goals.peso_max_ganho_mes || 0.5)) {
                        list.push({ level: 'warning', text: `Peso subiu ${delta.toFixed(1)}kg nos últimos 30 dias (acima do limite de ${goals.peso_max_ganho_mes}kg). Ajuste calorias em -100 a -150 kcal ou reduza carboidrato noturno.` });
                    }
                }
                const last3 = [0, 1, 2].map(n => addDaysISO(today, -n));
                if (!last3.some(d => dailyLogs[d])) {
                    list.push({ level: 'info', text: 'Sem registros de nutrição nos últimos 3 dias — bora retomar a consistência.' });
                }
                return list;
            }, [dailyLogs, goals, today]);

            const periodStart = addDaysISO(today, -(reportPeriod - 1));
            const periodDates = []; for (let i = 0; i < reportPeriod; i++) periodDates.push(addDaysISO(today, -i)); periodDates.reverse();
            const periodLogs = periodDates.map(d => dailyLogs[d]).filter(Boolean);
            const daysWithLog = periodLogs.length;
            const avgKcal = daysWithLog ? Math.round(periodLogs.reduce((s, l) => s + (l.kcal || 0), 0) / daysWithLog) : null;
            const avgProteina = daysWithLog ? Math.round(periodLogs.reduce((s, l) => s + (l.proteina || 0), 0) / daysWithLog) : null;
            const periodSessions = sessions.filter(s => s.date >= periodStart && s.date <= today);
            const expectedWorkouts = Math.round(reportPeriod * (6 / 7));
            const pesoSeries = periodDates.filter(d => dailyLogs[d] && dailyLogs[d].peso_manha != null).map(d => ({ date: d, value: dailyLogs[d].peso_manha }));

            const exerciseNames = React.useMemo(() => {
                const set = new Set();
                sessions.forEach(s => s.exercises.forEach(e => set.add(e.name)));

                                    <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4 space-y-3">
                                        <h3 className="font-bold text-sm">Nova avaliação</h3>
                                        <div><label className="text-[10px] uppercase text-neutral-500 font-bold">Data</label><input type="date" value={inbodyForm.data} onChange={e => setInbodyForm({ ...inbodyForm, data: e.target.value })} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-sm mt-1" /></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            {INBODY_FIELDS.map(([key, label]) => (
                                                <div key={key}><label className="text-[9px] uppercase text-neutral-500 font-bold">{label}</label><input type="number" step="0.1" value={inbodyForm[key]} onChange={e => setInbodyForm({ ...inbodyForm, [key]: e.target.value })} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-sm mt-1" /></div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={saveInbodyForm} className="flex-1 accent-grad py-2.5 rounded-lg font-bold">Salvar</button>
                                            <button onClick={() => setInbodyForm(null)} className="flex-1 bg-neutral-800 py-2.5 rounded-lg font-bold text-neutral-400">Cancelar</button>
                                        </div>
                                    </div>
                                )}

                                {inbody.length > 0 && (
                                    <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4 space-y-4">
                                        <h3 className="font-bold text-sm">Evolução</h3>
                                        <div><span className="text-xs text-neutral-500 font-bold">Peso (kg)</span><Chart series={inbody.map(a => ({ date: a.data, value: a.peso }))} color={COLORS.blue} unit="kg" target={{ min: goals.peso_alvo_min, max: goals.peso_alvo_max }} /></div>
                                        <div><span className="text-xs text-neutral-500 font-bold">% Gordura</span><Chart series={inbody.map(a => ({ date: a.data, value: a.percentual_gordura }))} color={COLORS.orange} unit="%" target={{ min: goals.gordura_alvo_min, max: goals.gordura_alvo_max }} /></div>
                                        <div><span className="text-xs text-neutral-500 font-bold">Massa muscular (kg)</span><Chart series={inbody.map(a => ({ date: a.data, value: a.massa_muscular }))} color={COLORS.green} unit="kg" /></div>
                                        <div><span className="text-xs text-neutral-500 font-bold">Gordura visceral</span><Chart series={inbody.map(a => ({ date: a.data, value: a.gordura_visceral }))} color={COLORS.aqua} /></div>
                                        <div><span className="text-xs text-neutral-500 font-bold">Cintura/Quadril</span><Chart series={inbody.map(a => ({ date: a.data, value: a.cintura_quadril }))} color={COLORS.violet} /></div>
                                    </div>
                                )}

                                {inbody.length >= 2 && (
                                    <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4 space-y-3">
                                        <h3 className="font-bold text-sm">Comparativo</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            <select value={compareA || ''} onChange={e => setCompareA(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs">
                                                {inbody.map(a => <option key={a.id} value={a.id}>{fmtBR(a.data)}</option>)}
                                            </select>
                                            <select value={compareB || ''} onChange={e => setCompareB(e.target.value)} className="bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs">
                                                {inbody.map(a => <option key={a.id} value={a.id}>{fmtBR(a.data)}</option>)}
                                            </select>
                                        </div>
                                        {(() => {
                                            const A = inbody.find(a => a.id === compareA); const B = inbody.find(a => a.id === compareB);
                                            if (!A || !B) return null;
                                            return (
                                                <div className="mt-2">
                                                    <CompareRow label="Peso" before={A.peso} after={B.peso} unit="kg" goodDir={null} />
                                                    <CompareRow label="Massa muscular" before={A.massa_muscular} after={B.massa_muscular} unit="kg" goodDir="up" />
                                                    <CompareRow label="Massa gordura" before={A.massa_gordura} after={B.massa_gordura} unit="kg" goodDir="down" />
                                                    <CompareRow label="% Gordura" before={A.percentual_gordura} after={B.percentual_gordura} unit="%" goodDir="down" />
                                                    <CompareRow label="Gordura visceral" before={A.gordura_visceral} after={B.gordura_visceral} unit="" goodDir="down" decimals={0} />
                                                    <CompareRow label="Cintura/Quadril" before={A.cintura_quadril} after={B.cintura_quadril} unit="" goodDir="down" decimals={2} />
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}

                                <div className="space-y-2">
                                    <h3 className="font-bold text-sm px-1">Histórico</h3>
                                    {[...inbody].reverse().map(a => (
                                        <div key={a.id} className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-3 flex justify-between items-center">
                                            <div>
                                                <p className="text-sm font-bold">{fmtBR(a.data)}</p>
                                                <p className="text-[11px] text-neutral-500">{a.peso}kg · {a.percentual_gordura}% gordura · visceral {a.gordura_visceral}</p>
                                            </div>
                                            <button onClick={() => deleteInbody(a.id)} className="text-neutral-600"><Icon name="Trash2" size={16} /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'progresso' && (
                            <div className="space-y-4 fade-in">
                                <div className="flex gap-2">
                                    {[7, 30, 90].map(p => (
                                        <button key={p} onClick={() => setReportPeriod(p)} className={`flex-1 py-2 rounded-lg text-xs font-bold ${reportPeriod === p ? 'accent-grad' : 'bg-neutral-900 border border-neutral-800 text-neutral-500'}`}>{p} dias</button>
                                    ))}
                                </div>

                                <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4">
                                    <h3 className="font-bold text-sm mb-3 flex items-center gap-2"><Icon name="ClipboardList" size={16} className="text-red-500" /> Relatório · últimos {reportPeriod} dias</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <StatTile label="Adesão nutrição" value={`${daysWithLog}/${reportPeriod}`} sub="dias registrados" />
                                        <StatTile label="Treinos feitos" value={`${periodSessions.length}/${expectedWorkouts}`} sub="esperado ~6/semana" />
                                        <StatTile label="Kcal média" value={avgKcal != null ? avgKcal : '--'} sub={goals.meta_kcal_media_semanal ? `meta ~${goals.meta_kcal_media_semanal}` : ''} />
                                        <StatTile label="Proteína média" value={avgProteina != null ? `${avgProteina}g` : '--'} sub={`meta ${goals.meta_proteina_min}-${goals.meta_proteina_max}g`} color={avgProteina != null && avgProteina < goals.meta_proteina_min ? COLORS.critical : undefined} />
                                    </div>
                                    {pesoSeries.length > 0 && <div><span className="text-xs text-neutral-500 font-bold">Peso no período</span><Chart series={pesoSeries} color={COLORS.blue} unit="kg" /></div>}
                                </div>

                                <div className="card-soft border border-white/5 rounded-2xl shadow-xl shadow-black/30 p-4">
                                    <h3 className="font-bold text-sm mb-3 flex items-center gap-2"><Icon name="TrendingUp" size={16} className="text-red-500" /> Progressão de carga</h3>
                                    {exerciseNames.length > 0 ? (
                                        <>
                                            <select value={selectedExercise} onChange={e => setSelectedExercise(e.target.value)} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs mb-3">
                                                {exerciseNames.map(n => <option key={n} value={n}>{n}</option>)}
                                            </select>
                                            <Chart series={exerciseSeries} color={COLORS.violet} unit="kg" />
                                        </>
                                    ) : <p className="text-xs text-neutral-600">Conclua treinos registrando carga para ver a progressão aqui.</p>}
                                </div>
                            </div>
                        )}

                        {view === 'config' && <div className="slide-in space-y-4">
                            <div className="bg-neutral-900 p-4 rounded-2xl border border-neutral-800 space-y-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold">Perfil e metas</h3>
                                    {!profileDraft && <button onClick={startEditProfile} className="text-[11px] text-red-500 font-bold">Editar</button>}
                                </div>
                                {!profileDraft ? (
                                    <div className="text-xs text-neutral-400 space-y-1">
                                        <p>{profile.nome} · {profile.idade} anos · {profile.altura_cm}cm</p>
                                        <p>Meta peso: {goals.peso_alvo_min}-{goals.peso_alvo_max}kg · Meta gordura: {goals.gordura_alvo_min}-{goals.gordura_alvo_max}%</p>
                                        <p>Meta proteína: {goals.meta_proteina_min}-{goals.meta_proteina_max}g/dia</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        <input value={profileDraft.nome} onChange={e => setProfileDraft({ ...profileDraft, nome: e.target.value })} placeholder="Nome" className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" value={profileDraft.idade} onChange={e => setProfileDraft({ ...profileDraft, idade: e.target.value })} placeholder="Idade" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                            <input type="number" value={profileDraft.altura_cm} onChange={e => setProfileDraft({ ...profileDraft, altura_cm: e.target.value })} placeholder="Altura (cm)" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" value={profileDraft.peso_alvo_min} onChange={e => setProfileDraft({ ...profileDraft, peso_alvo_min: e.target.value })} placeholder="Peso alvo mín" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                            <input type="number" value={profileDraft.peso_alvo_max} onChange={e => setProfileDraft({ ...profileDraft, peso_alvo_max: e.target.value })} placeholder="Peso alvo máx" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" value={profileDraft.gordura_alvo_min} onChange={e => setProfileDraft({ ...profileDraft, gordura_alvo_min: e.target.value })} placeholder="% Gordura mín" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                            <input type="number" value={profileDraft.gordura_alvo_max} onChange={e => setProfileDraft({ ...profileDraft, gordura_alvo_max: e.target.value })} placeholder="% Gordura máx" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" value={profileDraft.meta_proteina_min} onChange={e => setProfileDraft({ ...profileDraft, meta_proteina_min: e.target.value })} placeholder="Proteína mín (g)" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                            <input type="number" value={profileDraft.meta_proteina_max} onChange={e => setProfileDraft({ ...profileDraft, meta_proteina_max: e.target.value })} placeholder="Proteína máx (g)" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-sm" />
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={saveProfileDraft} className="flex-1 accent-grad py-2 rounded font-bold text-sm">Salvar</button>
                                            <button onClick={() => setProfileDraft(null)} className="flex-1 bg-neutral-800 py-2 rounded font-bold text-sm text-neutral-400">Cancelar</button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-neutral-900 p-4 rounded-2xl border border-neutral-800 space-y-3">
                                <h3 className="text-sm font-bold">Suplementos</h3>
                                <div className="space-y-2">
                                    {supplements.map(s => (
                                        <div key={s.id} className="flex justify-between items-center text-xs border-b border-neutral-800 pb-2 last:border-0">
                                            <div><p className="font-bold text-neutral-300">{s.nome}</p><p className="text-neutral-500">{s.dose} · {s.horario} · {s.status}</p></div>
                                            <button onClick={() => removeSupplement(s.id)} className="text-neutral-600"><Icon name="X" size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    <input value={newSupplement.nome} onChange={e => setNewSupplement({ ...newSupplement, nome: e.target.value })} placeholder="Nome" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-xs" />
                                    <input value={newSupplement.dose} onChange={e => setNewSupplement({ ...newSupplement, dose: e.target.value })} placeholder="Dose" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-xs" />
                                    <input value={newSupplement.horario} onChange={e => setNewSupplement({ ...newSupplement, horario: e.target.value })} placeholder="Horário" className="bg-neutral-950 border border-neutral-800 rounded p-2 text-xs" />
                                </div>
                                <button onClick={addSupplement} className="w-full bg-neutral-800 py-2 rounded text-xs font-bold text-neutral-300">+ Adicionar suplemento</button>
                            </div>

                            <div className="bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                                <h3 className="text-sm font-bold mb-2">Regras do coach (sempre válidas)</h3>
                                <ul className="text-[11px] text-neutral-500 space-y-1 list-disc pl-4">
                                    <li>Nunca recomendar TRT ou hormônios exógenos</li>
                                    <li>Nunca incentivar bulk agressivo</li>
                                    <li>Sempre alertar se déficit calórico passar de 500 kcal abaixo do TDEE</li>
                                    <li>Sempre monitorar cintura e peso dentro dos parâmetros mensais</li>
                                    <li>1 dia ruim não desfaz semanas de protocolo — consistência acima de perfeição</li>
                                </ul>
                            </div>

                            <div className="bg-neutral-900 p-4 rounded-2xl border border-neutral-800"><h3 className="text-sm font-bold mb-2">Importar treinos</h3><textarea value={importText} onChange={e => setImportText(e.target.value)} className="w-full h-32 bg-neutral-950 border border-neutral-800 rounded p-2 text-sm mb-2" placeholder="Cole aqui..." /><button onClick={processImport} className="w-full accent-grad py-2 rounded font-bold">Processar</button></div>
                            <button onClick={resetToDefault} className="w-full bg-neutral-800 py-3 rounded text-neutral-400 font-bold flex justify-center gap-2"><Icon name="RotateCcw" /> Restaurar Protocolo Padrão</button>
                            <button onClick={handleLogout} className="w-full border border-neutral-800 py-3 rounded text-neutral-400 font-bold flex justify-center gap-2"><Icon name="LogOut" /> Sair</button>
                            <button onClick={handleFullReset} className="w-full border border-red-900/30 text-red-800 py-3 rounded font-bold flex justify-center gap-2"><Icon name="Trash2" /> Reset Total</button>
                        </div>}

                    </main>

                    {view === 'workout' && <div className="fixed bottom-0 w-full p-4 bg-neutral-950/90 border-t border-red-900/30 backdrop-blur-md z-20"><div className="max-w-md mx-auto"><button onClick={finishWorkout} className="w-full accent-grad py-3.5 rounded-2xl font-bold flex justify-center gap-2 shadow-lg shadow-red-900/20"><Icon name="Save" size={18} /> Salvar Treino</button></div></div>}
                    {bottomNavVisible && <BottomNav view={view} onChange={setView} />}
                    {timerOpen && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm"><div className="bg-neutral-900 w-full max-w-sm p-6 rounded-2xl border border-neutral-800"><div className="flex justify-between mb-6"><h3 className="text-neutral-400">Descanso</h3><button onClick={closeTimer}><Icon name="Trash2" /></button></div><div className="text-center mb-8"><span className="text-7xl font-mono font-bold">{Math.floor(timeLeft / 60)}:{timeLeft % 60 < 10 ? '0' : ''}{timeLeft % 60}</span></div><div className="grid grid-cols-4 gap-2 mb-4">{[30, 45, 60, 90].map(t => <button key={t} onClick={() => startTimer(t)} className="bg-neutral-800 py-2 rounded text-xs font-bold">{t}s</button>)}</div><button onClick={() => setTimerRunning(!timerRunning)} className={`w-full py-3 rounded font-bold mb-2 ${timerRunning ? 'bg-neutral-800' : 'bg-green-600'}`}>{timerRunning ? 'Pausar' : 'Continuar'}</button><button onClick={() => startTimer(timeLeft + 10)} className="w-full py-3 rounded font-bold bg-neutral-950 border border-neutral-800">+10s</button></div></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW registrado!', reg))
                .catch(err => console.error('SW falhou:', err));
            });
        }
    </script>
</body>
</html>
