<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Seu app de treino pessoal offline.">
    
    <title>O treino no jeito</title>
    
    <!-- Link para o Manifesto PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Configurações iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="O treino no jeito">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000000%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2270%22>💪</text></svg>">

    <!-- Bibliotecas Externas (Serão cacheadas pelo Service Worker) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-neutral-950 text-white font-sans selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- ÍCONES ---
        const Icon = ({ name, size = 24, className }) => {
            if (typeof lucide === 'undefined' || !lucide.icons) return null;
            const iconData = lucide.icons[name];
            if (!iconData) return null;
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {iconData.map(([tag, attrs], index) => React.createElement(tag, { ...attrs, key: index }))}
                </svg>
            );
        };

        // --- DADOS DO TREINO (Seus 6 treinos configurados) ---
        const INITIAL_WORKOUTS = [
          {
            id: 't1',
            name: 'TREINO 1 - COSTAS - TRAPÉZIO – BICEPS',
            exercises: [
              { id: 't1e1', name: 'Remada CAVALINHO', sets: '4 X 10', note: 'CARGA MEDIANA COM FOCO NO CONTROLE DO MOVIMENTO E CONTRAÇÃO – ISOMETRIA DE 1s EM CADA REP' },
              { id: 't1e2', name: 'Puxada FECHADA no pulley barra', sets: '4 X 12', note: 'PROGRESÃO DE CARGA E CONTROLE TOTAL DO MOVIMENTO' },
              { id: 't1e3', name: 'Puxada pela frente com o triângulo', sets: '4 X 12', note: 'PROGRESSÃO DE CARGA – CARGAS ALTAS , MOVIMENTO COMPLETO' },
              { id: 't1e4', name: 'Remada na máquina de cabos', sets: '4 X 10', note: 'PUXADA BAIXA - UNILATERAL • CARGAS ALTAS, FOCAR NA CONTRAÇÃO E ISOMETRIA DE 2s EM CADA REP' },
              { id: 't1e5', name: 'TERRA', sets: '4 X 12', note: 'CONTROLE TOTAL DO MOVIMENTO, FOCO NA POSTURA E PROGRESSÃO DE CARGA SEMANAL' },
              { id: 't1e6', name: 'Encolhimento barra', sets: '4 X 10', note: 'CARGA ALTA COM CONTROLE DO MOVIMENTO' },
              { id: 't1e7', name: 'Bíceps barra W na polia', sets: '4 X 10', note: 'BISET • FOCAR NA CONTRAÇÃO E EXTENSÃO DO MOVIMENTO' },
              { id: 't1e8', name: 'Rosca martelo com HALTERES', sets: '4 X 10', note: 'BISET • DROP • CARGA ALTA COM BOA AMPLITUDE – DROP DE 30% DA CARGA NAS ULTIMAS 2 SÉRIES' }
            ]
          },
          {
            id: 't2',
            name: 'TREINO 2 - PEITO – TRICPES',
            exercises: [
              { id: 't2e1', name: 'Crossover com pega alta', sets: '4 X 10', note: 'MOVIMENTO AMPLO E CONTROLADO FOCANDO NA PROGRESÃO DE CARGA' },
              { id: 't2e2', name: 'Crossover com pega baixa', sets: '4 X 10', note: 'MOVIMENTO AMPLO E CONTROLADO FOCANDO NA PROGRESÃO DE CARGA' },
              { id: 't2e3', name: 'Supino inclinado Halteres', sets: '4 X 10', note: 'CARGA MODERADA/ ALTA – FOCANDO SEMPRE EM ESMAGAR O PEITROAL E CONTRAIR BEM NAS REP' },
              { id: 't2e4', name: 'Supino inclinado banco no Cross', sets: '4 X 10', note: 'PROGRESÃO DE CARGAS ALTAS + ISOMETRIA DE 2s EM CADA REP' },
              { id: 't2e5', name: 'Supino reto máquina ( ou livre )', sets: '4 X 10', note: 'PROGRESÃO DE CARGA – ISOMETRIA DE 10s NA ULTIMA REP DE CADA SÉRIE' },
              { id: 't2e6', name: 'Voador', sets: '4 X 10', note: 'CARGA MÁXIMA CONTROLANDO BEM NA VOLTA E EXPREMENDO O MIOLO DE PEITO – ISOMETRIA DE 10s NA ULTIMA REP DE CADA SÉRIE' },
              { id: 't2e7', name: 'Tríceps corda na polia', sets: '4 X 12', note: 'BISET • DROP • 1 DROP DE 50% DA CARGA EM CADA SÉRIE' },
              { id: 't2e8', name: 'Tríceps francês', sets: '4 X 12', note: 'BISET • CONTROLE DO MOVIMENTO – PROGRESSÃO DE CARGA' },
              { id: 't2e9', name: 'Máquina de ABS', sets: '4 x 12', note: 'CONTROLE TOTAL DO MOVIMENTO' }
            ]
          },
          {
            id: 't3',
            name: 'TREINO 3 - QUADRICEPS – ADUTOR – PANTURRILHA...',
            exercises: [
              { id: 't3e1', name: 'Cadeira extensora', sets: '4 X 20', note: 'PROGRESÃO DE CARGA E CONTROLE TOTAL DO MOVIMENTO' },
              { id: 't3e2', name: 'Agachamento', sets: '3 x 12', note: 'MOVIMENTO COMPLETO COM PROGRESÃO DE CARGA – SEMANAL' },
              { id: 't3e3', name: 'Agachamento sumo', sets: '3 x 12', note: 'MOVIMENTO CONTROLADO – CARGA MODERADA FOCANDO NA CONTRAÇÃO TOTAL DO MOVIMENTO' },
              { id: 't3e4', name: 'Leg Press 45', sets: '4 X 12', note: 'PÉS + ANGULADOS PARA DENTRO PARA MAIOR ATIVAÇÃO DOS QUADRICEPS – PROGRESSÃO DE CARGAS ALTAS' },
              { id: 't3e5', name: 'Cadeira adutora', sets: '3 X 15', note: 'BISET • DROP • FORCAR NA EXAUSTÃO, 1 DROP DE 50% DA CARGA EM CADA SÉRIE' },
              { id: 't3e6', name: 'Cadeira abdutora', sets: '3 X 15', note: 'BISET • DROP • FORCAR NA EXAUSTÃO, 1 DROP DE 50% DA CARGA EM CADA SÉRIE' },
              { id: 't3e7', name: 'Panturrilha no Leg com carga', sets: '5 x 15', note: 'DROP • SEM DESCANÇO ENTRE AS SÉRIES... TODA SÉRIE 1 DROP DE CARGA' },
              { id: 't3e8', name: 'Flexora deitada ou sentada', sets: '3 X 12', note: 'BISET • DROP • FORCAR NA EXAUSTÃO, 1 DROP DE 50% DA CARGA EM CADA SÉRIE' },
              { id: 't3e9', name: 'Stiff', sets: '3 X 12', note: 'BISET • FOCAR NA PROGRESÃO DE CARGA COM ISOMETRIA DE 2 S EM CADA REP' },
              { id: 't3e10', name: 'Elevação pélvica', sets: '4 X 12', note: 'DROP • FORCAR NA EXAUSTÃO, 1 DROP DE 50% DA CARGA EM CADA SÉRIE' }
            ]
          },
          {
            id: 't4',
            name: 'TREINO 4 - OMBRO – TRICPES',
            exercises: [
              { id: 't4e1', name: 'Desenvolvimento LIVRE', sets: '4 X 12', note: 'PROGRESSÃO DE CARGAS, CONTROLE TOTAL DO MOVIMENTO' },
              { id: 't4e2', name: 'Elevação lateral na polia', sets: '4 X 12', note: 'PROGRESSÃO DE CARGAS, CONTROLE TOTAL DO MOVIMENTO' },
              { id: 't4e3', name: 'Elevação frontal polia (corda)', sets: '4 X 12', note: 'PROGRESSÃO DE CARGAS, MOVIMENTO SÓLIDO, 2 S DE ISOMETRIA EM CADA REP' },
              { id: 't4e4', name: 'Voador inverso', sets: '4 x 12', note: 'PROGRESSÃO DE CARGAS, MOVIMENTO SÓLIDO, 2 S DE ISOMETRIA EM CADA REP' },
              { id: 't4e5', name: 'Tríceps corda na polia', sets: '4 x 12', note: 'BISET • PRGRESÃO DE CARGA ENTRE AS SÉRIES – CARGAS ALTAS' },
              { id: 't4e6', name: 'Tríceps barra RETA na polia', sets: '4 X 12', note: 'BISET • DROP • DROP DUPLO DE 25% DA CARGA TOTAL EM CADA DROP – FAZER ISSO NAS 4 SÉRIES' },
              { id: 't4e7', name: 'Tripes corda unilateral', sets: '4 x 12', note: 'FOCAR NA CONTRAÇÃO DO MOVIMENTO E PROGRESÃO DE CARGA' },
              { id: 't4e8', name: 'Encolhimento barra', sets: '4 X 10', note: 'CARGA ALTA COM CONTROLE DO MOVIMENTO' }
            ]
          },
          {
            id: 't5',
            name: 'TREINO 5 - COSTAS – BÍCPES',
            exercises: [
              { id: 't5e1', name: 'Puxada fechada no pulley', sets: '4 X 12', note: 'DROP • DROP DE 25% DA CARGA TOTAL EM CADA SÉRIE – CARGAS ALTAS' },
              { id: 't5e2', name: 'Puxada pela frente com o triângulo', sets: '4 X 12', note: 'PROGRESSÃO DE CARGAS, ISOMETIRA DE 2 S EM CADA REP' },
              { id: 't5e3', name: 'Remada bai xa com o triangulo', sets: '3 x 15', note: 'CARGA ALTA – PROGRESSÃO SEMANAL' },
              { id: 't5e4', name: 'Serrote unilateral na polia', sets: '3 X 15', note: 'PROGRESÃO DE CARGA + CONTROLE DA AMPLITUDE DO MOVIMENTO' },
              { id: 't5e5', name: 'Terra', sets: '4 x 10', note: 'PROGRESSÃO DE CARGAS SEMANAIS – CONTROLE TOTAL DO MOVIMENTO' },
              { id: 't5e6', name: 'Crucifixo em X no Cross Bilateral', sets: '4 X 12', note: 'PROGRESSÃO DE CARGAS, BOA CONTRAÇÃO DO MOVIMENTO E CONTROLE DA VOLTA' },
              { id: 't5e7', name: 'Rosca ARNOLD', sets: '4 X 12', note: 'BISET • PROGRESÃO DE CARGAS + CONTROLE TOTAL DO MOVIMENTO – SEM ROUBAR' },
              { id: 't5e8', name: 'Maquina de bíceps', sets: '4 X 12', note: 'BISET • DROP • CONTROLE TOTAL DO MOVIMENTO COM DROP DE 50% DA CARGA MÁXIMA – NA ULTIMA SÉRIE' },
              { id: 't5e9', name: 'ABS MILITAR ( Livre )', sets: '4 x 15', note: 'CONTROLE TOTAL DO MOVIMENTO' }
            ]
          },
          {
            id: 't6',
            name: 'TREINO 6 - QUADRICEPS – ADUTOR – PANTURRILHA...',
            exercises: [
              { id: 't6e1', name: 'Cadeira extensora', sets: '5 X 12', note: 'DROP • DROP DUPLO DE 25% DA CARGA TOTAL EM CADA DROP – FAZER ISSO NAS 6 SÉRIES' },
              { id: 't6e2', name: 'Agachamento livre', sets: '4 X 12', note: 'FOCAR NO CONTROLE DO MOVIMENTO E AMPLITUDE E PROGREÃO DE CARGA SEMANAL' },
              { id: 't6e3', name: 'Hack squat', sets: '4 X 12', note: 'DROP • DROP DUPLO DE 25% DA CARGA TOTAL EM CADA DROP – FAZER ISSO NAS 4 SÉRIES' },
              { id: 't6e4', name: 'Elevação pélvica', sets: '4 x 12', note: 'PROGRESSÃO DE CARGA E CONTROLE TOTAL DO MOVIMENTO – ISOMETRIA DE 2s EM CADA REP' },
              { id: 't6e5', name: 'Afundo', sets: '4 x 12', note: 'CONTROLE TOTAL DO MOVIMENTO E PROGRESSÃO DE CARGA SEMANAL' },
              { id: 't6e6', name: 'Cadeira adutora', sets: '2 X 20', note: 'BISET • FOCAR NA EXAUSTÃO MÁXIMA' },
              { id: 't6e7', name: 'Cadeira abdutora', sets: '2 X 20', note: 'BISET • FOCAR NA EXAUSTÃO MÁXIMA' },
              { id: 't6e8', name: 'Panturrilha sentada', sets: '4 X 15', note: 'FOCAR NA EXAUSTÃO MÁXIMA, COM BOA AMPLITUDE SEMPRE' },
              { id: 't6e9', name: 'Panturrilha no Leg com carga', sets: '3 X 12', note: 'FOCAR NA EXAUSTÃO MÁXIMA E ISOMETRIA DE 2 S EM CADA REP' },
              { id: 't6e10', name: 'ABS MILITAR ( Livre )', sets: '4 x 15', note: 'CONTROLE TOTAL DO MOVIMENTO' }
            ]
          }
        ];

        const App = () => {
            const [view, setView] = React.useState('login');
            const [workouts, setWorkouts] = React.useState(INITIAL_WORKOUTS);
            const [activeWorkoutId, setActiveWorkoutId] = React.useState(null);
            const [history, setHistory] = React.useState({});
            const [sessionData, setSessionData] = React.useState({});
            const [timerOpen, setTimerOpen] = React.useState(false);
            const [timeLeft, setTimeLeft] = React.useState(0);
            const [timerRunning, setTimerRunning] = React.useState(false);
            const [importText, setImportText] = React.useState('');
            const [userName, setUserName] = React.useState('');
            const [tempName, setTempName] = React.useState('');
            const timerInterval = React.useRef(null);

            React.useEffect(() => {
                const savedHistory = localStorage.getItem('gymHistoryV2');
                if (savedHistory) setHistory(JSON.parse(savedHistory));
                const savedWorkouts = localStorage.getItem('gymWorkoutsV2');
                if (savedWorkouts) setWorkouts(JSON.parse(savedWorkouts));
                const savedUser = localStorage.getItem('gymUserName');
                if (savedUser) { setUserName(savedUser); setView('home'); }
                if (window.lucide) window.lucide.createIcons();
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    localStorage.setItem('gymUserName', tempName.trim());
                    setUserName(tempName.trim());
                    setView('home');
                }
            };

            const handleLogout = () => {
                if(confirm("Deseja sair?")) {
                    localStorage.removeItem('gymUserName');
                    setUserName(''); setTempName(''); setView('login');
                }
            };

            const handleFullReset = () => {
                if(confirm("ATENÇÃO: Isso apagará TODOS os seus dados. Tem certeza?")) {
                    localStorage.clear(); window.location.reload();
                }
            };

            const processImport = () => {
                try {
                    if (!importText.trim()) return;
                    const lines = importText.split('\n').map(l => l.trim()).filter(l => l);
                    const newWorkouts = [];
                    let currentWorkout = null;
                    let exerciseCount = 0;
                    let nextIsBiset = false;

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        const upperLine = line.toUpperCase();

                        if (upperLine.startsWith('TREINO') || upperLine.startsWith('WORKOUT')) {
                            if (currentWorkout) newWorkouts.push(currentWorkout);
                            currentWorkout = { id: `imp_${Date.now()}_${newWorkouts.length}`, name: line, exercises: [] };
                            nextIsBiset = false; continue;
                        }

                        if (upperLine === 'BISET' || upperLine === '+') {
                            nextIsBiset = true;
                            if (upperLine === '+' && currentWorkout && currentWorkout.exercises.length > 0) {
                                const lastEx = currentWorkout.exercises[currentWorkout.exercises.length - 1];
                                if (!lastEx.note || !lastEx.note.includes('BISET')) {
                                    lastEx.note = lastEx.note ? `BISET • ${lastEx.note}` : 'BISET';
                                }
                            }
                            continue;
                        }

                        const setsMatch = line.match(/(\d+\s*[xX]\s*\d+)/);
                        if (setsMatch && currentWorkout) {
                            let namePart = line.substring(0, setsMatch.index).trim().replace(/^\d+[\.|-]\s*/, '').replace(/[-–]\s*$/, '');
                            let notePart = line.substring(setsMatch.index + setsMatch[0].length).trim().replace(/^\(/, '').replace(/\)$/, '');
                            let tags = [];
                            let isThisBiset = nextIsBiset;
                            const nextLine = (i + 1 < lines.length) ? lines[i+1].trim() : '';
                            if (nextLine === '+' || nextLine.toUpperCase() === 'BISET') { isThisBiset = true; nextIsBiset = true; } 
                            else { nextIsBiset = false; }

                            if (isThisBiset) tags.push('BISET');
                            if (upperLine.includes('DROP')) tags.push('DROP');
                            if (upperLine.includes('FALHA')) tags.push('FALHA');
                            
                            let finalNote = [...tags, notePart].join(' • ');
                            currentWorkout.exercises.push({ id: `ex_${currentWorkout.id}_${exerciseCount++}`, name: namePart, sets: setsMatch[0], note: finalNote });
                        }
                    }
                    if (currentWorkout) newWorkouts.push(currentWorkout);
                    if (newWorkouts.length > 0) {
                        setWorkouts(newWorkouts); localStorage.setItem('gymWorkoutsV2', JSON.stringify(newWorkouts));
                        alert('Treinos importados!'); setView('home'); setImportText('');
                    } else { alert('Padrão não reconhecido.'); }
                } catch (e) { alert('Erro ao processar.'); }
            };

            const resetToDefault = () => { if(confirm("Restaurar padrão?")) { setWorkouts(INITIAL_WORKOUTS); localStorage.removeItem('gymWorkoutsV2'); setView('home'); } };
            const startWorkout = (id) => { setActiveWorkoutId(id); setSessionData({}); setView('workout'); };
            const toggleExercise = (id) => { setSessionData(prev => ({...prev, [id]: {...prev[id], done: !prev[id]?.done}})); };
            const updateWeight = (id, w) => { setSessionData(prev => ({...prev, [id]: {...prev[id], weight: w}})); };
            const finishWorkout = () => {
                const newH = {...history};
                Object.keys(sessionData).forEach(id => { if(sessionData[id].done && sessionData[id].weight) newH[id] = sessionData[id].weight; });
                setHistory(newH); localStorage.setItem('gymHistoryV2', JSON.stringify(newH));
                setView('home'); setActiveWorkoutId(null);
            };
            const startTimer = (s) => { clearInterval(timerInterval.current); setTimeLeft(s); setTimerOpen(true); setTimerRunning(true); timerInterval.current = setInterval(() => setTimeLeft(p => p<=1 ? (clearInterval(timerInterval.current), setTimerRunning(false), 0) : p-1), 1000); };
            const closeTimer = () => { setTimerOpen(false); clearInterval(timerInterval.current); };
            const activeWorkout = workouts.find(w => w.id === activeWorkoutId);

            if (view === 'login') return (
                <div className="min-h-screen bg-neutral-950 flex flex-col items-center justify-center p-6 fade-in">
                    <div className="mb-8 text-red-600 animate-pulse"><Icon name="Dumbbell" size={64} /></div>
                    <h1 className="text-3xl font-bold mb-2 text-center">O treino no jeito</h1>
                    <p className="text-neutral-400 mb-8 text-center max-w-xs">App offline. Seus dados ficam no seu celular.</p>
                    <form onSubmit={handleLogin} className="w-full max-w-xs space-y-4">
                        <input type="text" value={tempName} onChange={e=>setTempName(e.target.value)} placeholder="Seu Nome" className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-4 text-white focus:border-red-600 outline-none" autoFocus />
                        <button type="submit" disabled={!tempName.trim()} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl disabled:opacity-50">Entrar</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen bg-neutral-950 pb-20 fade-in">
                    <header className="sticky top-0 z-20 bg-neutral-950/90 backdrop-blur-md border-b border-red-900/30 p-4">
                        <div className="flex items-center justify-between max-w-md mx-auto">
                            {view !== 'home' ? <button onClick={()=>setView('home')}><Icon name="ChevronLeft" /></button> : <div className="flex items-center gap-2 text-red-600"><Icon name="Dumbbell" size={20}/><span className="text-white font-bold">Olá, {userName}</span></div>}
                            {view === 'home' && <button onClick={()=>setView('importer')} className="text-neutral-400 hover:text-red-500"><Icon name="Settings"/></button>}
                            {view === 'workout' && <h1 className="font-bold text-sm text-neutral-200 truncate ml-2">{activeWorkout?.name.split('-')[1] || 'Treino'}</h1>}
                        </div>
                    </header>
                    <main className="max-w-md mx-auto p-4 space-y-4">
                        {view === 'importer' && <div className="slide-in space-y-4">
                            <h2 className="text-xl font-bold flex gap-2"><Icon name="Edit3" className="text-red-500"/> Configurações</h2>
                            <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800"><h3 className="text-sm font-bold mb-2">Importar</h3><textarea value={importText} onChange={e=>setImportText(e.target.value)} className="w-full h-32 bg-neutral-950 border border-neutral-800 rounded p-2 text-sm mb-2" placeholder="Cole aqui..."/><button onClick={processImport} className="w-full bg-red-600 py-2 rounded font-bold">Processar</button></div>
                            <button onClick={resetToDefault} className="w-full bg-neutral-800 py-3 rounded text-neutral-400 font-bold flex justify-center gap-2"><Icon name="RotateCcw"/> Restaurar Padrão</button>
                            <button onClick={handleLogout} className="w-full border border-neutral-800 py-3 rounded text-neutral-400 font-bold flex justify-center gap-2"><Icon name="LogOut"/> Sair</button>
                            <button onClick={handleFullReset} className="w-full border border-red-900/30 text-red-800 py-3 rounded font-bold flex justify-center gap-2"><Icon name="Trash2"/> Reset Total</button>
                        </div>}
                        {view === 'home' && <div className="space-y-3">{workouts.map((w,i)=>(
                            <button key={w.id} onClick={()=>startWorkout(w.id)} className={`w-full bg-neutral-900 border border-neutral-800 border-l-4 p-5 rounded-r-xl rounded-l-md flex justify-between items-center active:scale-[0.98] ${['border-l-red-500','border-l-orange-500'][i%2]}`}>
                                <div className="text-left overflow-hidden"><h3 className="font-bold text-sm truncate">{w.name}</h3><span className="text-xs text-neutral-500">{w.exercises.length} Ex</span></div><Icon name="Play" size={16} className="text-neutral-600"/>
                            </button>
                        ))}</div>}
                        {view === 'workout' && activeWorkout && <div className="space-y-4 pb-24 slide-in">{activeWorkout.exercises.map((ex,i)=>{
                            const isDone = sessionData[ex.id]?.done;
                            const isBiset = ex.note && ex.note.includes('BISET');
                            return (
                                <div key={ex.id} className="relative">
                                    {isBiset && i<activeWorkout.exercises.length-1 && activeWorkout.exercises[i+1].note?.includes('BISET') && <div className="absolute left-8 mt-[3.5rem] w-1 h-8 bg-red-600/30"></div>}
                                    <div className={`p-4 rounded-xl border relative z-10 ${isDone?'bg-red-950/20 border-red-900/30':'bg-neutral-900 border-neutral-800'}`}>
                                        {ex.note && <div className="mb-2"><span className="text-[10px] font-bold px-2 py-1 rounded bg-neutral-800 text-red-500 border border-red-900/30 whitespace-normal leading-tight block">{ex.note}</span></div>}
                                        <div className="flex justify-between mb-4"><div><h3 className={`font-bold ${isDone?'text-red-500/50 line-through':'text-neutral-200'}`}>{ex.name}</h3><span className="text-xs bg-neutral-950 px-2 py-0.5 rounded border border-neutral-800 text-neutral-400">{ex.sets}</span></div><button onClick={()=>toggleExercise(ex.id)} className={isDone?'text-red-600':'text-neutral-600'}><Icon name={isDone?'CheckCircle':'Circle'} size={28}/></button></div>
                                        <div className={`grid grid-cols-[1fr,auto] gap-3 items-end ${isDone?'opacity-50 pointer-events-none':''}`}>
                                            <div className="bg-neutral-950 p-2 rounded border border-neutral-800 flex justify-between items-center"><div className="w-full"><span className="text-[9px] text-neutral-500 font-bold uppercase block">Carga</span><input type="number" placeholder={history[ex.id]||'0'} value={sessionData[ex.id]?.weight||''} onChange={e=>updateWeight(ex.id,e.target.value)} className="bg-transparent text-lg font-bold w-full outline-none"/></div>{history[ex.id]&&<div className="border-l border-neutral-800 pl-2 text-right"><span className="text-[9px] text-neutral-500 block">Ant.</span><span className="text-xs">{history[ex.id]}</span></div>}</div>
                                            <button onClick={()=>startTimer(60)} className="h-full bg-neutral-800 w-12 rounded border border-neutral-700 flex justify-center items-center text-neutral-400"><Icon name="Clock" size={20}/></button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}</div>}
                    </main>
                    {view === 'workout' && <div className="fixed bottom-0 w-full p-4 bg-neutral-950/90 border-t border-red-900/30 backdrop-blur-md z-20"><div className="max-w-md mx-auto"><button onClick={finishWorkout} className="w-full bg-red-600 py-3.5 rounded-xl font-bold flex justify-center gap-2 shadow-lg shadow-red-900/20"><Icon name="Save" size={18}/> Salvar Treino</button></div></div>}
                    {timerOpen && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm"><div className="bg-neutral-900 w-full max-w-sm p-6 rounded-2xl border border-neutral-800"><div className="flex justify-between mb-6"><h3 className="text-neutral-400">Descanso</h3><button onClick={closeTimer}><Icon name="Trash2"/></button></div><div className="text-center mb-8"><span className="text-7xl font-mono font-bold">{Math.floor(timeLeft/60)}:{timeLeft%60<10?'0':''}{timeLeft%60}</span></div><div className="grid grid-cols-4 gap-2 mb-4">{[30,45,60,90].map(t=><button key={t} onClick={()=>startTimer(t)} className="bg-neutral-800 py-2 rounded text-xs font-bold">{t}s</button>)}</div><button onClick={()=>setTimerRunning(!timerRunning)} className={`w-full py-3 rounded font-bold mb-2 ${timerRunning?'bg-neutral-800':'bg-green-600'}`}>{timerRunning?'Pausar':'Continuar'}</button><button onClick={()=>startTimer(timeLeft+10)} className="w-full py-3 rounded font-bold bg-neutral-950 border border-neutral-800">+10s</button></div></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('SW registrado!', reg))
                .catch(err => console.error('SW falhou:', err));
            });
        }
    </script>
</body>
</html>
